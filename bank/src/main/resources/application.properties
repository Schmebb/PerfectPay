spring.application.name=bank
bank.code=BANK_A
server.port=8081
# Where outgoing payments are sent.
hub.url=http://localhost:8080
# Longer than the hub's own 5s wait for the payee bank, so we don't give up while the hub is still waiting.
hub.timeout=10s
# How often to ask the hub about payments still SENT (no final answer yet).
bank.enquiry-interval=5s
# If the hub still has no record of a payment this long after we sent it, it never arrived: refund.
bank.refund-unknown-after=60s
directory.url=http://localhost:8090
# How often to retry registering phone numbers if the directory wasn't up yet.
bank.registration-retry-interval=5s
# Health and metrics: /actuator/health, /actuator/prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.bank=${bank.code}
