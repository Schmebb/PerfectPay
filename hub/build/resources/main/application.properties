spring.application.name=hub
server.port=8080
# Participant registry: bank code -> where that bank's API lives.
hub.participants[BANK_A]=http://localhost:8081
hub.participants[BANK_B]=http://localhost:8082
# Largest single payment the scheme allows: R3,000.
hub.scheme-limit-cents=300000
hub.forward-timeout=5s
# How often PENDING payments are re-sent to the payee bank to find out what happened.
hub.retry-interval=5s
# "Today" for the settlement report.
hub.time-zone=Africa/Johannesburg
# Health and metrics: /actuator/health, /actuator/prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
